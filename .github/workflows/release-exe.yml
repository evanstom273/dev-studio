name: Build & Release Desktop App (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:all

      - name: Build Tauri Desktop (.exe & .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: dev-studio-v__VERSION__
          releaseName: 'Dev Studio Desktop v__VERSION__'
          releaseBody: 'Download Dev Studio Desktop for Windows (.exe installer and standalone binary).'
          releaseDraft: true
          prerelease: false
